pre-push:
  commands:
    packages-audit:
      tags: frontend security
      run: bun audit

pre-commit:
  commands:
    oxlint:
      glob: '*.{js,jsx,ts,tsx}'
      run: bunx oxlint {staged_files}
    oxfmt:
      glob: '*.{js,jsx,ts,tsx,json,css,html}'
      run: bunx oxfmt --write {staged_files} && git add {staged_files}
